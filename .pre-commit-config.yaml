---
default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix', 'lf']
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 05fd71a57a467ccf5598f7e836d3af4cf9225abb  # frozen: v1.108.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--fix
      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yaml
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 38980559e3a605691d6579f96222c30778e5a69e  # frozen: 3.0.0
    hooks:
      - id: script-must-have-extension
      - id: shellcheck
      - id: shfmt
  - repo: https://github.com/hukkin/mdformat
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # frozen: 1.0.0
    hooks:
      - id: mdformat
        # needed to support exclude in `.mdformat.toml`
        # pre-commit runs on python 3.12 by default on MacOS and most linux distributions.
        # Install python 3.13 if pre-commit fails.
        language_version: "3.13"
        # Optionally add plugins
        additional_dependencies:
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-shfmt
          - mdformat-toc
  - repo: local
    hooks:
      - id: ensure-policy-defaults-sync-pre-configured
        name: Ensure policy defaults for pre-configured rules are in sync
        entry: /usr/bin/env bash -c 'diff rules-pre-configured.tf modules/regional-backend-security-policy/rules-pre-configured.tf >/dev/null || (echo "Difference in rules-pre-configured.tf files detected"; false)'
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 25d0a52aa8bc0fc242613346792dc8d726c13347  # frozen: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
